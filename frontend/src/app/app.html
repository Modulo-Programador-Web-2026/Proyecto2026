<div class="container mt-5 text-center">
  <div class="card shadow p-4">
    <h2>Hola desde el frontend</h2>

    @if (mensaje) {
      <p class="text-success fw-bold">
        {{ mensaje }}
      </p>
    }

    @if (version) {
      <p>
        Versión API: <strong>{{ version }}</strong>
      </p>
    }

    <button 
      class="btn btn-primary mt-3"
      (click)="probarConexion()">
      Hacer click para probar conexión
    </button>
  </div>
</div>
