<div class="container">

    <div class="card">

        <div class="left">

            <h1>Nueva Campaña</h1>

            <form
                [formGroup]="campaniaForm"
                (ngSubmit)="onSubmit()">

                <div class="input-group">

                    <label>Título</label>

                    <input
                        type="text"
                        formControlName="titulo"
                        placeholder="Título">

                </div>

                <div class="input-group">

                    <label>Descripción</label>

                    <textarea
                        rows="6"
                        formControlName="descripcion"
                        placeholder="Descripción">
                    </textarea>

                </div>

                <div class="input-group">

                    <label>Ubicación</label>

                    <input
                        type="text"
                        formControlName="ubicacion"
                        placeholder="Hospital, clínica o centro de donación">

                </div>

                <div class="input-group">

                    <label>Fecha inicio</label>

                    <input
                        type="date"
                        formControlName="fecha_inicio">

                </div>

                <div class="input-group">

                    <label>Fecha fin</label>

                    <input
                        type="date"
                        formControlName="fecha_fin">

                </div>

                <div class="input-group">

                    <label>Estado</label>

                    <select formControlName="estado_campania">

                        <option value="">
                            Seleccionar
                        </option>

                        @for (estado of estados; track estado.id) {

                        <option [value]="estado.id">

                            {{ estado.estado }}

                        </option>

                        }

                    </select>

                </div>

                <button
                    type="submit"
                    class="submit-btn"
                    [disabled]="cargando">

                    {{ cargando
                    ? 'Creando campaña...'
                    : 'Crear campaña' }}

                </button>

                @if(mensaje){

                    <p class="mensaje-ok">
                        {{mensaje}}
                    </p>

                }

                @if(error){

                    <p class="mensaje-error">
                        {{error}}
                    </p>

                }

            </form>

        </div>

        <div class="right">

            <img
                src="https://cdn-icons-png.flaticon.com/128/3063/3063188.png"
                alt="Campaña">

            <h2>
                Gestioná campañas de donación de sangre.
            </h2>

        </div>

    </div>

</div>
